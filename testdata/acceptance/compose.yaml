name: polyfin-provider-acceptance

# Strictly isolated local Docker pilot; never import a production volume,
# state backend, Authentik identity or application URL.
services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: polyfin
      POSTGRES_USER: polyfin
      POSTGRES_PASSWORD: ${ACCEPTANCE_POSTGRES_PASSWORD:?Configure local acceptance secret}
    volumes:
      - postgres_qa:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyfin -d polyfin"]
      interval: 5s
      timeout: 4s
      retries: 30
    networks: [acceptance]
    restart: "no"
  polyfin:
    image: ghcr.io/moodiness/polyfin:0.60.0@sha256:e2b1d1624a985292ef7a69434a9fd43cea2ead37202b1860c659d18a609125a6
    environment:
      POLYFIN_DATABASE_URL: postgresql://polyfin:${ACCEPTANCE_POSTGRES_PASSWORD:?Configure local acceptance secret}@postgres:5432/polyfin
      POLYFIN_DATA_DIR: /data
      POLYFIN_SECRET_KEY: ${ACCEPTANCE_POLYFIN_SECRET_KEY:?Configure local acceptance secret}
    ports:
      - "127.0.0.1:18096:8096"
    volumes:
      - polyfin_qa:/data
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [acceptance]
    restart: "no"
networks:
  acceptance:
    internal: true
volumes:
  postgres_qa: {}
  polyfin_qa: {}
